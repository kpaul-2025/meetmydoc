<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />

      <title>Meet.My.DOC - Book Appointment</title>

      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Favicon -->
      <link href="img/favicon.ico" rel="icon" />

      <!-- Google Fonts -->
      <link
         href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Roboto:wght@500;700;900&display=swap"
         rel="stylesheet"
      />

      <!-- Icons -->
      <link
         href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
         rel="stylesheet"
      />

      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
         rel="stylesheet"
      />

      <!-- Bootstrap -->
      <link href="css/bootstrap.min.css" rel="stylesheet" />

      <link href="css/style.css" rel="stylesheet" />

      <!-- EmailJS -->
      <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

      <style>
         body {
            background: #f8f9fa;
         }

         .appointment-card {
            max-width: 850px;
            margin: auto;
         }

         .required {
            color: red;
         }

         .slot-btn {
            border: none;

            padding: 10px 16px;

            border-radius: 10px;

            background: #e7f1ff;

            color: #0d6efd;

            font-weight: 600;

            transition: 0.3s;
         }

         .slot-btn:hover {
            background: #0d6efd;

            color: white;
         }

         .slot-selected {
            background: #0d6efd !important;

            color: white !important;
         }

         .slot-booked {
            background: #ffd6d6 !important;

            color: #dc3545 !important;

            cursor: not-allowed;

            opacity: 0.7;
         }
      </style>
   </head>

   <body>
      <!-- NAVBAR -->

      <nav class="navbar navbar-expand-lg bg-white navbar-light sticky-top p-0">
         <a
            href="index.html"
            class="navbar-brand d-flex align-items-center px-4 px-lg-5"
         >
            <h1 class="m-0 text-primary">
               <i class="far fa-hospital me-3"></i>

               Meet.My.DOC
            </h1>
         </a>

          <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">

            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <a href="index.html" class="nav-item nav-link active">Home</a>
                <a href="doctors.html" class="nav-item nav-link">Doctors</a>
                <a href="service.html" class="nav-item nav-link">Services</a>
                <a href="contact.html" class="nav-item nav-link">Contact</a>
            </div>

        </div>

      </nav>

      <!-- HEADER -->

      <div class="container-fluid page-header py-5 mb-5 bg-primary">
         <div class="container py-5">
            <h1 class="display-5 text-white">Book Appointment</h1>
         </div>
      </div>

      <!-- APPOINTMENT -->

      <div class="container py-5">
         <div class="appointment-card bg-white shadow rounded p-5">
            <p
               class="d-inline-block border rounded-pill py-1 px-4 text-primary"
            >
               Book Appointment
            </p>

            <h2 class="mb-4">Schedule Your Consultation</h2>

            <form id="appointmentForm">
               <div class="row g-3">
                  <!-- NAME -->

                  <div class="col-md-6">
                     <label class="form-label">
                        Patient Name
                        <span class="required">*</span>
                     </label>

                     <input
                        type="text"
                        id="patient_name"
                        class="form-control"
                        required
                     />
                  </div>

                  <!-- PHONE -->

                  <div class="col-md-6">
                     <label class="form-label">
                        Phone
                        <span class="required">*</span>
                     </label>

                     <input
                        type="tel"
                        id="phone"
                        class="form-control"
                        required
                     />
                  </div>

                  <!-- EMAIL -->

                  <div class="col-md-6">
                     <label class="form-label">
                        Email
                        <span class="required">*</span>
                     </label>

                     <input
                        type="email"
                        id="email"
                        class="form-control"
                        required
                     />
                  </div>

                  <!-- DEPARTMENT -->

                  <div class="col-md-6">
                     <label class="form-label">
                        Department
                        <span class="required">*</span>
                     </label>

                     <select id="department" class="form-select" required>
                        <option value="">Select Department</option>

                        <option value="Neurology">Neurology</option>

                        <option value="Cardiology">Cardiology</option>

                        <option value="Endocrinologist">Endocrinologist</option>

                        <option value="Gastroenterologist">
                           Gastroenterologist
                        </option>

                        <option value="General Medicine">
                           General Medicine
                        </option>

                        <option value="Ophthalmology">Ophthalmology</option>

                        <option value="Orthopedics">Orthopedics</option>
                     </select>
                  </div>

                  <!-- DOCTOR -->

                  <div class="col-md-6">
                     <label class="form-label">
                        Doctor
                        <span class="required">*</span>
                     </label>

                     <select id="doctor" class="form-select" required>
                        <option value="">Select Doctor</option>
                     </select>
                  </div>

                  <!-- DATE -->

                  <div class="col-md-6">
                     <label class="form-label">
                        Preferred Date
                        <span class="required">*</span>
                     </label>

                     <input
                        type="date"
                        id="date"
                        class="form-control"
                        required
                     />
                  </div>

                  <!-- AVAILABLE TIME SLOTS -->

                  <div class="col-12">
                     <div class="slot-wrapper">
                        <label class="form-label mb-3">
                           Available Time Slots
                           <span class="required">*</span>
                        </label>

                        <div id="slotContainer" class="slot-grid">
                           <div class="slot-placeholder">
                              Select doctor and date
                           </div>
                        </div>
                     </div>
                  </div>

                  <!-- NOTES -->

                  <div class="col-12">
                     <label class="form-label"> Notes </label>

                     <textarea
                        id="notes"
                        class="form-control"
                        rows="4"
                        placeholder="Write symptoms or additional details..."
                     ></textarea>
                  </div>

                  <!-- BUTTON -->

                  <div class="col-12">
                     <button
                        type="submit"
                        id="submitBtn"
                        class="btn btn-primary w-100 py-3"
                     >
                        Book Appointment
                     </button>
                  </div>
               </div>
            </form>
         </div>
      </div>

   <!-- APPOINTMENT SUCCESS POPUP -->

   <div id="appointmentPopup"
      class="success-popup">

      <div class="success-card">

         <div class="success-icon">

               <i class="fa fa-check"></i>

         </div>

         <h3>
               Appointment Confirmed
         </h3>

         <p class="mb-4">

               Your appointment has been booked successfully.

         </p>

         <div class="appointment-summary">

               <div class="summary-item">

                  <span>Doctor</span>

                  <strong id="popupDoctor">
                     --
                  </strong>

               </div>

               <div class="summary-item">

                  <span>Date</span>

                  <strong id="popupDate">
                     --
                  </strong>

               </div>

               <div class="summary-item">

                  <span>Time</span>

                  <strong id="popupTime">
                     --
                  </strong>

               </div>

         </div>

         <div class="ticket-box">

               <span>
                  Appointment ID
               </span>

               <strong id="popupAppointmentId">
                  MMD-APT-000000
               </strong>

         </div>

         <button id="closeAppointmentPopup"
               class="btn btn-primary rounded-pill px-4 mt-4">

               Done

         </button>

      </div>

   </div>

      <!-- FOOTER -->

      <div class="container-fluid bg-dark text-light py-4 mt-5">
         <div class="container text-center">
            <p class="mb-0">© Meet.My.DOC</p>
         </div>
      </div>

      <!-- JS -->

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

      <script>
         (function () {
            /* =========================================
   EMAILJS CONFIG
========================================= */

            const EMAILJS_PUBLIC_KEY = "zfmx3pB3Qi5Ns4TpU";

            const EMAILJS_SERVICE_ID = "service_msv076q";

            const EMAILJS_TEMPLATE_USER = "template_8oo0i5s";

            const EMAILJS_TEMPLATE_ADMIN = "template_bkecbi8";

            const ADMIN_EMAIL = "projectpaulkritika@gmail.com";

            /* =========================================
   GOOGLE SCRIPT URL
========================================= */

            const GOOGLE_SCRIPT_URL =
               "https://script.google.com/macros/s/AKfycby2JTqS-uymSkLCEhXQuC0rmrSjPkjJDvmAEXLnqqPCne2VtZV_Bq1lywWK0tvJfkqH/exec";

            /* =========================================
   GOOGLE SHEET JSON URL
========================================= */

            const SHEET_JSON_URL =
               "https://opensheet.elk.sh/1yrOKnn9xCOeh-eE1GMCNxsJhgdzMwYOBZ3XcZpHwSos/Sheet1";

            /* =========================================
   INIT EMAILJS
========================================= */

            emailjs.init(EMAILJS_PUBLIC_KEY);

            /* =========================================
   DOCTORS
========================================= */

            const doctorsByDept = {
               Neurology: ["Dr. Abir Lal Nath"],

               Cardiology: ["Dr. Arup Deb", "Dr. Nilanjan Majumdar"],

               Endocrinologist: ["Dr. Mukut Roy"],

               Gastroenterologist: ["Dr. Vikas Kohli"],

               "General Medicine": ["Dr. Nitish Das"],

               Ophthalmology: ["Dr. Abhijit Ray"],

               Orthopedics: ["Dr. Amaresh Shil"],
            };

            /* =========================================
   DOCTOR SCHEDULES
========================================= */

            const doctorSchedules = {
               "Dr. Abhijit Ray": {
                  days: ["Wednesday", "Friday"],
                  start: "09:00",
                  end: "15:00",
               },

               "Dr. Abir Lal Nath": {
                  days: ["Tuesday", "Thursday"],
                  start: "10:00",
                  end: "17:00",
               },

               "Dr. Amaresh Shil": {
                  days: ["Monday", "Wednesday", "Friday"],
                  start: "11:00",
                  end: "18:00",
               },

               "Dr. Arup Deb": {
                  days: [
                     "Monday",
                     "Tuesday",
                     "Wednesday",
                     "Thursday",
                     "Friday",
                  ],
                  start: "09:00",
                  end: "15:00",
               },

               "Dr. Mukut Roy": {
                  days: ["Monday", "Wednesday"],
                  start: "10:00",
                  end: "15:00",
               },

               "Dr. Nilanjan Majumdar": {
                  days: [
                     "Tuesday",
                     "Wednesday",
                     "Thursday",
                     "Friday",
                     "Saturday",
                  ],
                  start: "10:00",
                  end: "16:00",
               },

               "Dr. Nitish Das": {
                  days: [
                     "Monday",
                     "Tuesday",
                     "Wednesday",
                     "Thursday",
                     "Friday",
                     "Saturday",
                     "Sunday",
                  ],
                  start: "08:00",
                  end: "20:00",
               },

               "Dr. Vikas Kohli": {
                  days: [
                     "Tuesday",
                     "Wednesday",
                     "Thursday",
                     "Friday",
                     "Saturday",
                  ],
                  start: "10:00",
                  end: "14:00",
               },
            };

            let selectedSlot = "";

            /* =========================================
   POPULATE DOCTORS
========================================= */

            function populateDoctors(department) {
               const doctorSelect = document.getElementById("doctor");

               doctorSelect.innerHTML =
                  '<option value="">Select Doctor</option>';

               if (!doctorsByDept[department]) return;

               doctorsByDept[department].forEach((doc) => {
                  const option = document.createElement("option");

                  option.value = doc;

                  option.textContent = doc;

                  doctorSelect.appendChild(option);
               });
            }

            /* =========================================
   PAGE LOAD
========================================= */

            document.addEventListener(
               "DOMContentLoaded",

               function () {
                  document
                     .getElementById("department")
                     .addEventListener("change", function () {
                        populateDoctors(this.value);
                     });

                  const today = new Date().toISOString().split("T")[0];

                  document.getElementById("date").setAttribute("min", today);
               },
            );

            /* =========================================
   SLOT SYSTEM
========================================= */

            document
               .getElementById("doctor")
               .addEventListener("change", updateSlots);

            document
               .getElementById("date")
               .addEventListener("change", updateSlots);

            async function updateSlots() {
               const doctor = document.getElementById("doctor").value;

               const date = document.getElementById("date").value;

               const container = document.getElementById("slotContainer");

               selectedSlot = "";

               if (!doctor || !date) {
                  container.innerHTML = `
<div class="text-muted">
Select doctor and date
</div>
`;

                  return;
               }

               const schedule = doctorSchedules[doctor];

               const dayName = new Date(date).toLocaleDateString("en-US", {
                  weekday: "long",
               });

               if (!schedule.days.includes(dayName)) {
                  container.innerHTML = `
<div class="text-danger">
Doctor unavailable on ${dayName}
</div>
`;

                  return;
               }

               container.innerHTML = "Loading slots...";

               const response = await fetch(SHEET_JSON_URL);

               const bookings = await response.json();

               const bookedSlots = bookings

                  .filter((b) => b.Doctor === doctor && b.Date === date)

                  .map((b) => b.Time);

               container.innerHTML = "";

               let current = timeToMinutes(schedule.start);

               const end = timeToMinutes(schedule.end);

               while (current < end) {
                  const slot = minutesToTime(current);

                  const btn = document.createElement("button");

                  btn.type = "button";

                  btn.innerText = slot;

                  btn.className = "slot-btn";

                  if (bookedSlots.includes(slot)) {
                     btn.disabled = true;

                     btn.classList.add("slot-booked");

                     btn.innerText = slot + " Booked";
                  } else {
                     btn.addEventListener("click", function () {
                        document
                           .querySelectorAll(".slot-btn")
                           .forEach((b) => b.classList.remove("slot-selected"));

                        btn.classList.add("slot-selected");

                        selectedSlot = slot;
                     });
                  }

                  container.appendChild(btn);

                  current += 20;
               }
            }

            function timeToMinutes(time) {
               const parts = time.split(":");

               return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }

            function minutesToTime(minutes) {
               const hrs = Math.floor(minutes / 60)
                  .toString()
                  .padStart(2, "0");

               const mins = (minutes % 60).toString().padStart(2, "0");

               return `${hrs}:${mins}`;
            }

            /* =========================================
   APPOINTMENT ID
========================================= */

            function generateAppointmentId() {
               return "APPT-" + Date.now().toString(36).toUpperCase();
            }

            /* =========================================
   VALIDATION
========================================= */

            async function validateBooking(
               patient_email,
               doctor_name,
               appointment_date,
               appointment_time,
            ) {
               try {
                  const response = await fetch(SHEET_JSON_URL);

                  const bookings = await response.json();

                  for (const booking of bookings) {
                     const sameDoctor = booking.Doctor === doctor_name;

                     const sameDate = booking.Date === appointment_date;

                     const sameTime = booking.Time === appointment_time;

                     const samePatient = booking.Email === patient_email;

                     /* SAME SLOT */

                     if (sameDoctor && sameDate && sameTime) {
                        alert("Selected slot already booked.");

                        return false;
                     }

                     /* SAME USER SAME TIME */

                     if (samePatient && sameDate && sameTime) {
                        alert(
                           "You already have another appointment at this time.",
                        );

                        return false;
                     }
                  }

                  return true;
               } catch (error) {
                  console.error(error);

                  alert("Booking validation failed.");

                  return false;
               }
            }

            /* =========================================
   SUBMIT FORM
========================================= */

            document

               .getElementById("appointmentForm")

               .addEventListener(
                  "submit",

                  async function (e) {
                     e.preventDefault();

                     if (!selectedSlot) {
                        alert("Please select a time slot.");

                        return;
                     }

                     /* GET VALUES */

                     const patient_name = document
                        .getElementById("patient_name")
                        .value.trim();

                     const patient_phone = document
                        .getElementById("phone")
                        .value.trim();

                     const patient_email = document
                        .getElementById("email")
                        .value.trim();

                     const department =
                        document.getElementById("department").value;

                     const doctor_name =
                        document.getElementById("doctor").value;

                     const appointment_date = document
                        .getElementById("date")
                        .value.trim();

                     const appointment_time = selectedSlot;

                     const notes = document
                        .getElementById("notes")
                        .value.trim();

                     /* BUTTON */

                     const btn = document.getElementById("submitBtn");

                     btn.disabled = true;

                     btn.innerText = "Checking Availability...";

                     /* VALIDATE */

                     const isValid = await validateBooking(
                        patient_email,
                        doctor_name,
                        appointment_date,
                        appointment_time,
                     );

                     if (!isValid) {
                        btn.disabled = false;

                        btn.innerText = "Book Appointment";

                        return;
                     }

                     /* APPOINTMENT ID */

                     const appointment_id = generateAppointmentId();

                     /* FORM DATA */

                     const formData = {
                        appointment_id: appointment_id,

                        patient_name: patient_name,

                        email: patient_email,

                        phone: patient_phone,

                        department: department,

                        doctor: doctor_name,

                        date: appointment_date,

                        time: appointment_time,

                        notes: notes,
                     };

                     /* SAVE TO SHEET */

                     try {
                        const response = await fetch(
                           GOOGLE_SCRIPT_URL,

                           {
                              method: "POST",

                              headers: {
                                 "Content-Type": "text/plain;charset=utf-8",
                              },

                              body: JSON.stringify(formData),
                           },
                        );

                        const result = await response.text();

                        console.log(result);

                        if (!response.ok) {
                           throw new Error(result);
                        }
                     } catch (error) {
                        console.error(error);

                        alert("Failed to save appointment.\n\n" + error);

                        btn.disabled = false;

                        btn.innerText = "Book Appointment";

                        return;
                     }

                     /* USER EMAIL */

                     const userParams = {
                        email: patient_email,

                        patient_name: patient_name,

                        appointment_id: appointment_id,

                        doctor_name: doctor_name,

                        department: department,

                        appointment_date: appointment_date,

                        appointment_time: appointment_time,

                        notes: notes,
                     };

                     /* ADMIN EMAIL */

                     const adminParams = {
                        to_email: ADMIN_EMAIL,

                        patient_name: patient_name,

                        patient_email: patient_email,

                        patient_phone: patient_phone,

                        appointment_id: appointment_id,

                        doctor_name: doctor_name,

                        department: department,

                        appointment_date: appointment_date,

                        appointment_time: appointment_time,

                        notes: notes,
                     };

                     /* SEND EMAILS */

                     emailjs
                        .send(
                           EMAILJS_SERVICE_ID,

                           EMAILJS_TEMPLATE_USER,

                           userParams,
                        )

                        .then(function () {
                           return emailjs.send(
                              EMAILJS_SERVICE_ID,

                              EMAILJS_TEMPLATE_ADMIN,

                              adminParams,
                           );
                        })

                        .then(function () {

                           /* POPUP DATA */

                           document
                           .getElementById("popupDoctor")
                           .textContent = doctor_name;

                           document
                           .getElementById("popupDate")
                           .textContent = appointment_date;

                           document
                           .getElementById("popupTime")
                           .textContent = appointment_time;

                           document
                           .getElementById("popupAppointmentId")
                           .textContent = appointment_id;

                           /* SHOW POPUP */

                           document
                           .getElementById("appointmentPopup")
                           .classList.add("show");

                           /* RESET FORM */

                           document
                           .getElementById("appointmentForm")
                           .reset();

                           document
                           .getElementById("slotContainer")
                           .innerHTML =
                           `<div class="text-muted">
                              Select doctor and date
                           </div>`;

                           selectedSlot = "";

                           btn.disabled = false;

                           btn.innerText = "Book Appointment";

                        })

                        .catch(function (error) {
                           console.error(error);

                           alert("Email sending failed.");

                           btn.disabled = false;

                           btn.innerText = "Book Appointment";
                        });

                        /* =========================================
                           CLOSE POPUP
                        ========================================= */

                        document
                        .getElementById("closeAppointmentPopup")
                        .addEventListener("click", function () {

                           document
                           .getElementById("appointmentPopup")
                           .classList.remove("show");

                        });

                  },
               );
         })();
      </script>
   </body>
</html>
