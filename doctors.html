
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <title>Doctors - Meet.My.DOC</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="img/favicon.ico" rel="icon">

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light sticky-top p-0 wow fadeIn">

        <a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5">

            <h1 class="m-0 text-primary">
                <i class="far fa-hospital me-3"></i>
                Meet.My.DOC
            </h1>

        </a>

        <button type="button" class="navbar-toggler me-4"
            data-bs-toggle="collapse"
            data-bs-target="#navbarCollapse">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarCollapse">

            <div class="navbar-nav ms-auto p-4 p-lg-0">

                <a href="index.html" class="nav-item nav-link">Home</a>

                <a href="doctors.html" class="nav-item nav-link active">Doctors</a>

                <a href="service.html" class="nav-item nav-link">Services</a>

                <a href="contact.html" class="nav-item nav-link">Contact</a>

            </div>

            <a href="apoinmnet.html"
                class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block">

                Book Appointment
                <i class="fa fa-arrow-right ms-3"></i>

            </a>

        </div>

    </nav>

    <!-- Header -->
    <div class="container-fluid page-header py-5 mb-5">

        <div class="container py-5">

            <h1 class="display-3 text-white mb-3">
                Our Doctors
            </h1>

        </div>

    </div>

    <!-- Doctors -->
    <div class="container-xxl py-5">

        <div class="container">

            <div class="text-center mx-auto mb-5" style="max-width: 700px;">

                <p class="d-inline-block border rounded-pill py-1 px-4">
                    Our Specialists
                </p>

                <h1>
                    Meet Our Experienced Doctors
                </h1>

            </div>

            <!-- Search -->
            <div class="row mb-5">

                <div class="col-lg-8 mx-auto">

                    <div class="bg-white rounded-pill shadow-sm p-2">

                        <div class="row g-2">

                            <div class="col-md-5">

                                <input id="doctorSearch"
                                    type="text"
                                    class="form-control border-0 rounded-pill px-4"
                                    placeholder="Search Doctor">

                            </div>

                            <div class="col-md-4">

                                <select id="doctorSpec"
                                    class="form-select border-0 rounded-pill px-4">

                                    <option value="">
                                        All Departments
                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3">

                                <select id="doctorSort"
                                    class="form-select border-0 rounded-pill px-4">

                                    <option value="name_asc">
                                        Name A-Z
                                    </option>

                                    <option value="name_desc">
                                        Name Z-A
                                    </option>

                                    <option value="exp_desc">
                                        Experience High-Low
                                    </option>

                                    <option value="exp_asc">
                                        Experience Low-High
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Doctors Grid -->
            <div class="row g-4" id="doctorsGrid"></div>

        </div>

    </div>

    <!-- Footer -->
    <div class="container-fluid bg-dark text-light footer mt-5 pt-5 wow fadeIn">

        <div class="container py-5">

            <div class="row g-5">

                <div class="col-lg-4 col-md-6">

                    <h5 class="text-light mb-4">
                        Address
                    </h5>

                    <p>
                        <i class="fa fa-map-marker-alt me-3"></i>
                        Agartala, Tripura, India
                    </p>

                    <p>
                        <i class="fa fa-phone-alt me-3"></i>
                        +91 123456789
                    </p>

                    <p>
                        <i class="fa fa-envelope me-3"></i>
                        info@meetmydoc.com
                    </p>

                </div>

                <div class="col-lg-4 col-md-6">

                    <h5 class="text-light mb-4">
                        Services
                    </h5>

                    <a class="btn btn-link" href="">Cardiology</a>
                    <a class="btn btn-link" href="">Neurology</a>
                    <a class="btn btn-link" href="">Orthopedics</a>

                </div>

                <div class="col-lg-4 col-md-6">

                    <h5 class="text-light mb-4">
                        Quick Links
                    </h5>

                    <a class="btn btn-link" href="index.html">Home</a>
                    <a class="btn btn-link" href="doctors.html">Doctors</a>
                    <a class="btn btn-link" href="contact.html">Contact</a>

                </div>

            </div>

        </div>

    </div>

    <!-- Back To Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top">

        <i class="bi bi-arrow-up"></i>

    </a>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <script src="lib/wow/wow.min.js"></script>

    <script src="js/main.js"></script>
